global:
  scrape_interval: 10s  # Set the scrape interval to every 15 seconds


rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: 'django-metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true # ignora o fato do certificado ser auto assinado
    static_configs:
      - targets: ['django:443']
