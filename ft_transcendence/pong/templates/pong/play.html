{% load static %}
<div class="row app-row justify-content-center gap-4 gap-md-5 px-3 px-md-4 px-lg-5">
    <div class="col-play-mode col col-12 col-md-11 col-lg-9 p-0 mx-2 d-flex flex-column rounded-4">
        <p class="title title-play-mode rounded-top-4 text-center m-0 p-2 py-3">Select a game mode</p>
        <div class="mode d-flex flex-column flex-md-row justify-content-center py-3 py-md-1">
            <form class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 px-2 py-3"
                id="gameModeForm"
                method="post"
                formType="localGameForm"
                api-link>
                {% csrf_token %}
                <input type="hidden" name="game_mode" value="{{ GameMode.LOCAL }}">
                <button class="play-mode-btn rounded-4 col-11 col-sm-9 col-md-3" type="submit" api-link>
                    <p class="d-flex justify-content-center m-0">Local</p>
                </button>
            </form>
            <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 px-2 py-3">
                <a class="play-mode-btn rounded-4 col-11 col-sm-9 col-md-3 d-flex align-items-center justify-content-center text-decoration-none" href="/enter/online/" data-link>
                    Online
                </a>
            </div>
            <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 px-2 py-3">
                <a class="play-mode-btn rounded-4 col-11 col-sm-9 col-md-3 d-flex align-items-center justify-content-center text-decoration-none" href="/enter/tournament/" data-link>
                    Tournament
                </a>
            </div>
        </div>
    </div>
</div>
