{% load static %}
<div class="app-row d-flex flex-column flex-md-row justify-content-center gap-2 gap-md-4 px-3 px-md-4 px-lg-5">
    <div class="col col-12 col-md-4 d-flex flex-row flex-md-column gap-3 d-flex justify-content-center"
    id="game-data"
    data-tournament-id="{{ tournament.id }}"
    data-game-mode="tournament"
    data-username="{{ user.username }}">
        <div class="col-tournament p-0 rounded-4">
            <div class="title rounded-top-4 d-flex flex-row align-items-center justify-content-center">
                <p class="title rounded-top-4 text-center m-0 p-2 text-nowrap">Tournament</p>
            </div>
            <div class="p-3">
                <p class="text-tournament m-0 text-nowrap">Name: {{ tournament.name }}</p>
                <p class="text-tournament m-0 text-nowrap">Max Players:
                    <span id="maxPlayersValue">8</span>
                </p>
            </div>
        </div>
        <div class="col-tournament p-0 rounded-4">
            <div class="title rounded-top-4 d-flex flex-row align-items-center justify-content-center">
                <p class="title rounded-top-4 text-center m-0 p-2 text-nowrap">Players</p>
            </div>
            <div class="p-2 px-md-3">
                <div class="d-flex flex-row p-0 mb-2">
                    <label id="player-name"></label>
                    <input type="text" name="name" class="form-control form-player rounded-5 border-0 mr-2" placeholder="Choose a name" title="player-name" maxlength="20">
                    <button class="btn btn-custom px-2">
                        <p class="btn-custom-name-enter m-0">
                            ok
                        </p>
                    </button>
                </div>
                <div class="d-flex flex-row p-0 mb-2">
                    <label id="player-name"></label>
                    <input type="text" name="name" class="form-control form-player rounded-5 border-0 mr-2" placeholder="Choose a name" title="player-name" maxlength="20">
                    <button class="btn btn-custom px-2">
                        <p class="btn-custom-name-enter m-0">
                            ok
                        </p>
                    </button>
                </div>
                <div class="d-flex flex-row p-0 mb-2">
                    <label id="player-name"></label>
                    <input type="text" name="name" class="form-control form-player rounded-5 border-0 mr-2" placeholder="Choose a name" title="player-name" maxlength="20">
                    <button class="btn btn-custom px-2">
                        <p class="btn-custom-name-enter m-0">
                            ok
                        </p>
                    </button>
                </div>
                <div class="d-flex flex-row p-0 mb-2">
                    <label id="player-name"></label>
                    <input type="text" name="name" class="form-control form-player rounded-5 border-0 mr-2" placeholder="Choose a name" title="player-name" maxlength="20">
                    <button class="btn btn-custom px-2">
                        <p class="btn-custom-name-enter m-0">
                            ok
                        </p>
                    </button>
                </div>
                <div class="d-flex justify-content-center">
                    <button id="startTournament" class="btn btn-custom">
                        <p class="btn-custom-name-enter m-0">Start</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="col-matches col col-12 col-md-7 p-0 rounded-4">
        <div class="title rounded-top-4 d-flex flex-row align-items-center justify-content-center">
            <p class="title rounded-top-4 text-center m-0 p-2 text-nowrap">Matches</p>
        </div>
        <div class="matches p-2 d-flex flex-column gap-1 gap-md-2">
            <div id="semi-finals">
                <p class="enter-title m-0">Semifinals</p>
                <div class="row d-flex justify-content-center gap-2">
                    <div class="create-room-box col col-5 rounded-4 px-2 d-flex justify-content-center">
                        <div class="d-flex flex-column py-1 rounded-3" id="Semi-1">
                            <div class="text-tournament text-center m-0 text-nowrap" id="Semi-1-p1">
                                TBD
                            </div>
                            <div class="text-tournament text-center m-0 text-nowrap" id="Semi-1-p2">
                                TBD
                            </div>
                            <p class="text-tournament text-center m-0">waiting for game...</p>
                        </div>
                    </div>
                    <div class="create-room-box col col-5 rounded-4 px-2 d-flex justify-content-center">
                        <div class="d-flex flex-column py-1 rounded-3" id="Semi-2">
                            <div class="text-tournament text-center m-0 text-nowrap" id="Semi-2-p1">
                                TBD
                            </div>
                            <div class="text-tournament text-center m-0 text-nowrap" id="Semi-2-p2">
                                TBD
                            </div>
                            <p class="text-tournament text-center m-0">waiting for game...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div id="final">
                <p class="enter-title m-0">Final</p>
                <div class="d-flex justify-content-center gap-2">
                    <div class="create-room-box col col-6 rounded-4 px-2 d-flex justify-content-center">
                        <div class="d-flex flex-column py-1 rounded-3" id="Final">
                            <div class="text-tournament text-center m-0 text-nowrap" id="Final-p1">
                                TBD
                            </div>
                            <div class="text-tournament text-center m-0 text-nowrap" id="Final-p2">
                                TBD
                            </div>
                            <p class="text-tournament text-center m-0">waiting for game...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-center">
                <button class="btn btn-custom py-1 px-2" id="play-btn">
                    <p class="btn-custom-name-enter m-0">Play</p>
                </button>
            </div>
        </div>
    </div>
</div>
