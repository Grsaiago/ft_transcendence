<form class="form-sign-in text-center rounded-4 shadow" method="post">
    {% csrf_token %}
        <p class="form-title text-center rounded-top-4 py-2 py-md-3 m-0">Log in to your<br>account!</p>
        <div class="py-3 py-md-4 px-4 px-md-5">
            {% for field in form %}
            <div class="mb-2">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}<small>{{ field.errors|striptags }}</small>{% endif %}
            </div>
            {% endfor %}

            {% if messages %}
            {% for message in messages %}
            <div class="alert text-danger p-0 mb-2 {% if message.tags %}alert-{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}
            <input class="btn btn-sm btn-custom" type="submit" value="LOGIN">
        </div>
</form>
