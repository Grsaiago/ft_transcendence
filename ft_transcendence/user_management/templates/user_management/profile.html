<div class="row app-row justify-content-center gap-5 px-5">
    <div class="col-profile col col-12 col-md-4 col-lg-3 col-xl-2 p-0 d-flex flex-row flex-md-column align-items-center justify-content-center gap-4">
        <img class="profile-image rounded-circle" src="../../../static/assets/foto-perfil.png">
        <div class="col col-5 col-md-12 p-0">
            <div class="profile-div shadow-sm rounded-4">
                <p class="profile-title rounded-top-4 text-center m-0 p-2">{{ user.username }}</p>
                <div class="profile-discription d-flex flex-column gap-1 p-3 px-lg-4">
                    <p class="m-0">{{ user.first_name }}</p>
                    <p class="m-0">Online on: </p>
                    <p class="m-0">Games played: </p>
                    <p class="m-0">Total wins: </p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-history col col-12 col-md-7 col-lg-6 col-xl-5 p-0 d-flex flex-column">
        <div class="h-100 history shadow-sm rounded-4">
            <p class="history-title rounded-top-4 text-center m-0 p-2 text-nowrap">Game history</p>
            <div class=" history-discription p-3 d-flex flex-column gap-1">
                <p class="text-center m-0">You haven't played any games yet.</p>
            </div>
        </div>
    </div>
</div>
