<form class="form-sign text-center rounded-4 shadow" method="post">
    {% csrf_token %}
    <p class="form-title text-center rounded-top-4 py-2 py-md-3 m-0">Create a new<br>account!</p>
    <div class="py-3 py-md-4 px-4 px-md-5">
        {% for field in form %}
        <div class="mb-2">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}<small>{{ field.errors|striptags }}</small>{% endif %}
        </div>
        {% endfor %}
        <button class="btn btn-custom mt-1" type="submit" value="register">
            <p class="btn-custom-name m-0">register</p>
        </button>
    </div>
</form>
