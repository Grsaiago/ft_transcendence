{% load static %}
<div class="row app-row justify-content-center gap-3 gap-md-4 gap-lg-5 px-5">
    <div class="col-friends col col-8 col-sm-6 col-md-4 col-lg-3 col-xl-2 p-0 rounded-4">
        <p class="title rounded-top-4 text-center m-0 p-2 text-nowrap">Amigos</p>
        <div class="p-2 p-lg-3">
            <div class="search d-flex flex-row align-items-center rounded-5 mb-2">
                <input type="text" class="form-control rounded-5 border-0" placeholder="search user">
                <!-- <img class="search-icon mx-2" src="{% static 'assets/icons/Search.png' %}"> -->
                <i class="search-icon mx-2 bi bi-search"></i>
            </div>
            {% for friend, chat_room_id in current_friends.items %}
            <div class="friend d-flex flex-row align-items-center justify-content-between gap-2 px-2 py-1">
                <div class="d-flex flex-row align-items-center gap-2">
                    <div class="status-icon">
                        <img class="friend-img rounded-circle border-0" src="{% static 'assets/foto-perfil.png' %}">
                    </div>
                    <p class="friend-name m-0 cursor-pointer" chat_id="{{ chat_room_id }}" data-chat>
                        {{ friend }}
                    </p>
                </div>
                <i class="bi bi-info-circle"></i>
                
                <!-- <img class="info-icon" src="{% static 'assets/icons/Info.png' %}"> -->
            </div>
            {% empty %}
            <p>You have no friends!</p>
            {% endfor %}
        </div>
    </div>
    
    <!-- Chat Window Section -->
    <div class="col-chat col col-12 col-md-7 col-lg-6 col-xl-5 p-0 d-flex flex-column rounded-4">
        <p class="title rounded-top-4 text-center m-0 p-2 text-nowrap">Chat</p>
        <div class="p-2 d-flex flex-column flex-grow-1">
            <div class="messages d-flex flex-column align-items-end px-2" id ="chat-messages">
                <!-- Chat messages will appear here -->
                <div>
                    <p class="chat-msg-user-time">Fernanda, 15:04</p>
                    <p class="chat-msg-content">Fala ai fdp</p>
                </div>
                <div>
                    <p class="chat-msg-user-time">Fernanda, 15:07</p>
                    <p class="chat-msg-content">Turo bom ?</p>
                </div>
            </div>
            <div class="message-input d-flex flex-row align-items-center justify-content-end rounded-5 m-0 mt-auto">
                <input class="form-control rounded-5 border-0" type="text" id="chat-message-input" placeholder="Type a message">
            <button type="button" class="btn-send btn border-0 rounded-end-4 rounded-start-0 cursor-pointer" value="send" data-send-msg >send</button>
            </div>
        </div>
    </div>
</div>
